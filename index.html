<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b43">
  <title>هلدینگ</title>
  <style>
    @font-face {
      font-family: HoldingLocal;
      src: url("assets/fonts/Vazirmatn-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: HoldingLocal;
      src: url("assets/fonts/Vazirmatn-Medium.woff2") format("woff2");
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: HoldingLocal;
      src: url("assets/fonts/Vazirmatn-Bold.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --gold: #d2b27b;
      --ivory: #fffaf1;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--ivory);
      background: #142b43;
      font-family: HoldingLocal, Tahoma, sans-serif;
    }

    .intro {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100svh;
      min-height: 100dvh;
      place-items: center;
      overflow: hidden;
      padding: clamp(22px, 5vh, 54px) 20px;
      background: #142b43;
    }

    .intro-photo {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* فقط برای خوانایی نوشته؛ تصویر باید کاملاً دیده شود. */
    .intro::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(8, 22, 36, .17), rgba(8, 22, 36, .08) 50%, rgba(8, 22, 36, .17)),
        linear-gradient(0deg, rgba(8, 22, 36, .22), transparent 42%, rgba(8, 22, 36, .10));
      pointer-events: none;
    }

    .frame {
      position: absolute;
      inset: clamp(12px, 2.2vw, 28px);
      border: 1px solid rgba(236, 211, 164, .48);
      pointer-events: none;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: clamp(28px, 5vw, 58px);
      height: clamp(28px, 5vw, 58px);
      border-color: var(--gold);
      border-style: solid;
      opacity: .85;
    }

    .frame::before {
      top: -1px;
      right: -1px;
      border-width: 2px 2px 0 0;
    }

    .frame::after {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 2px 2px;
    }

    .content {
      width: min(100%, 680px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 12px;
      animation: reveal .8s ease both;
    }

    .logo {
      display: block;
      width: clamp(104px, 14vw, 154px);
      height: clamp(104px, 14vw, 154px);
      object-fit: contain;
      filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .34));
    }

    .gold-rule {
      width: clamp(52px, 7vw, 76px);
      height: 2px;
      margin: clamp(18px, 3vh, 27px) auto 14px;
      background: var(--gold);
      box-shadow: 0 0 12px rgba(210, 178, 123, .35);
    }

    h1 {
      margin: 0;
      color: #fffdf8;
      font-size: clamp(42px, 7.2vw, 76px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -.035em;
      text-shadow: 0 3px 18px rgba(0, 0, 0, .42);
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .intro { padding: 22px 16px; }
      .frame { inset: 9px; }
      .content { padding: 16px 8px; }
      .logo {
        width: clamp(92px, 27vw, 124px);
        height: clamp(92px, 27vw, 124px);
      }
      .gold-rule { margin-top: 17px; margin-bottom: 11px; }
      h1 { font-size: clamp(39px, 12vw, 56px); }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .content { padding: 8px; }
      .logo { width: 76px; height: 76px; }
      .gold-rule { margin: 10px auto 7px; }
      h1 { font-size: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
    }
  </style>
</head>
<body>
  <main class="intro" aria-labelledby="holding-title">
    <img class="intro-photo" src="assets/images/introback.webp" alt="" fetchpriority="high">
    <div class="frame" aria-hidden="true"></div>
    <section class="content">
      <img class="logo" src="assets/images/logo.webp" alt="نشان هلدینگ">
      <div class="gold-rule" aria-hidden="true"></div>
      <h1 id="holding-title">هلدینگ</h1>
    </section>
  </main>
</body>
</html>
