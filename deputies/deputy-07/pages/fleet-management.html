function jalaliDate(value){if(!value)return '';const p=String(value).slice(0,10).split('-').map(Number);if(p.length!==3||!p[0]||!p[1]||!p[2])return String(value);const parts=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(p[0],p[1]-1,p[2]));const get=t=>parts.find(x=>x.type===t)?.value||'';return get('year')+'/'+get('month')+'/'+get('day')}
function jalaliToISO(value){
 const raw=String(value||'').trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[.\-]/g,'/');
 const m=raw.match(/^(\d{3,4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return '';
 const jy=+m[1],jm=+m[2],jd=+m[3];if(jm<1||jm>12||jd<1)return '';
 const targetYear=String(jy).padStart(4,'0')+'/01/01',base=Date.UTC(jy+621,2,19);
 let yearStart=null,nextYearStart=null;
 for(let i=0;i<16;i++){const d=new Date(base+i*86400000),iso=[d.getUTCFullYear(),String(d.getUTCMonth()+1).padStart(2,'0'),String(d.getUTCDate()).padStart(2,'0')].join('-');if(jalaliDate(iso)===targetYear){yearStart=base+i*86400000;break}}
 if(yearStart===null)return '';
 const nextTarget=String(jy+1).padStart(4,'0')+'/01/01';
 for(let i=350;i<=380;i++){const d=new Date(yearStart+i*86400000),iso=[d.getUTCFullYear(),String(d.getUTCMonth()+1).padStart(2,'0'),String(d.getUTCDate()).padStart(2,'0')].join('-');if(jalaliDate(iso)===nextTarget){nextYearStart=yearStart+i*86400000;break}}
 if(nextYearStart===null)return '';
 const yearLength=(nextYearStart-yearStart)/86400000,monthLength=jm<=6?31:jm<=11?30:(yearLength===366?30:29);
 if(jd>monthLength)return '';
 const offset=(jm<=6?(jm-1)*31:186+(jm-7)*30)+jd-1;
 if(offset>=yearLength)return '';
 const d=new Date(yearStart+offset*86400000);
 return [d.getUTCFullYear(),String(d.getUTCMonth()+1).padStart(2,'0'),String(d.getUTCDate()).padStart(2,'0')].join('-');
}

function checklistState(item,v){
 if(!item.checkedAt||item.result==='بررسی نشده')return {key:'unknown',label:'بررسی نشده'};
 if(item.result==='نیازمند اقدام'||item.result==='معیوب')return {key:'action',label:'نیازمند اقدام'};
 const days=dayGap(item.dueDate),kmLeft=item.dueKm?Number(item.dueKm)-Number(v?.km||0):null;
 if((days!==null&&days<0)||(kmLeft!==null&&kmLeft<=0))return {key:'late',label:'سررسید گذشته'};
 if((days!==null&&days<=30)||(kmLeft!==null&&kmLeft<=1000))return {key:'soon',label:'نزدیک سررسید'};
 if(!item.dueDate&&!item.dueKm)return {key:'unknown',label:'بدون سررسید'};
 return {key:'ok',label:'معتبر'};
}

 $('#entryform').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));r.status=d.status;r.vehicleCode=d.vehicle==='—'?'':d.vehicle.split(' | ')[0];r.driver=d.driver;r.missionNo=d.missionNo;r.notes=d.notes;r.updatedAt=new Date().toISOString();if(r.status==='وسیله تخصیص یافت'&&r.vehicleCode){const v=db.vehicles.find(x=>x.code===r.vehicleCode);if(v){v.currentDept=r.department||v.currentDept;v.currentPerson=r.driver||v.currentPerson}}save();closeModal();render('requests');toast('وضعیت درخواست به‌روزرسانی شد')};
}

 return '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>صورت‌جلسه '+esc(a.code)+'</title><style>@font-face{font-family:NetFa;src:url(../assets/fonts/Vazirmatn-Regular.woff2)}@font-face{font-family:NetFa;src:url(../assets/fonts/Vazirmatn-Bold.woff2);font-weight:700}*{box-sizing:border-box}body{font-family:NetFa,Tahoma,sans-serif;color:#23364a;margin:0 auto;padding:9mm;max-width:210mm;font-size:10px;line-height:1.6}.head{display:flex;justify-content:space-between;border-bottom:2px solid #244d70;padding-bottom:7px}.brand{color:#587086}.docno{border:1px solid #c6d2dc;border-radius:5px;padding:3px 9px;font-weight:bold;color:#244d70}.title{text-align:center;margin:9px 0 2px;font-size:16px;color:#193d5d}.subtitle{text-align:center;color:#718194;font-size:9px;margin-bottom:8px}.section{margin-top:8px;break-inside:avoid}.section h2{font-size:10px;color:#244d70;margin:0 0 4px;padding:4px 8px;background:#eef3f7;border-right:3px solid #527b9b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.item{display:flex;gap:6px;padding:2px 1px;border-bottom:1px dotted #d7e0e7;min-height:21px}.item b{color:#63778a;font-weight:400;min-width:92px}.item span{font-weight:700;overflow-wrap:anywhere}.block{padding:3px 1px;border-bottom:1px dotted #d7e0e7}.block b{display:block;color:#63778a;font-weight:400}.block div{min-height:16px;overflow-wrap:anywhere}.notes{border:1px solid #b9c8d5;border-radius:4px;margin-top:7px;padding:5px 8px;min-height:64px}.notes strong{color:#244d70}.blank{height:18px;border-bottom:1px dotted #d5dee6}.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;break-inside:avoid}.sign div{border:1px solid #bac8d4;border-radius:4px;height:58px;padding:5px;text-align:center;color:#52697e}.sign b{display:block;color:#244d70;margin-bottom:19px}.foot{text-align:center;font-size:8px;color:#7b8996;margin-top:6px}.toolbar{text-align:center;margin:10px}.toolbar button{font:inherit;border:0;border-radius:5px;background:#  form.onsubmit=e=>{
